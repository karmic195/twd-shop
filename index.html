<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWD SHOP — Vêtements & objets de série</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11130f;
    --bg-alt:#24271f;
    --paper:#d9d4c7;
    --ink:#e7e2d7;
    --ink-dark:#171914;
    --amber:#b56a2a;
    --magenta:#6f261f;
    --line: rgba(243,238,226,0.18);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(181,106,42,.06), transparent 28%),
      radial-gradient(circle at 85% 80%, rgba(111,38,31,.06), transparent 30%),
      var(--bg);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    line-height:1.5;
  }
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode:overlay;
  }

  /* ---------- HERO ---------- */
  header.hero{
    padding:5rem 1.5rem 4rem;
    text-align:center;
    background:
      radial-gradient(ellipse at top, rgba(181,106,42,0.20), transparent 55%),
      linear-gradient(rgba(17,19,15,.88),rgba(17,19,15,.97)),
      var(--bg);
    border-bottom:1px dashed var(--line);
    position:relative;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.35em;
    font-size:0.7rem;
    color:var(--amber);
    text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:clamp(2.8rem,9vw,6rem);
    letter-spacing:0.04em;
    margin:0.4rem 0 0.6rem;
    text-transform:uppercase;
    text-shadow: 3px 3px 0 var(--magenta), 6px 6px 0 rgba(0,0,0,0.25);
  }
  header.hero p{
    max-width:38rem; margin:0 auto;
    color:rgba(243,238,226,0.75);
    font-size:1.05rem;
  }

  /* ---------- TABS ---------- */
  nav.tabs{
    display:flex; justify-content:center; gap:0.75rem;
    padding:2rem 1.5rem 0; flex-wrap:wrap;
  }
  nav.tabs button{
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    padding:0.6rem 1.3rem;
    border-radius:999px;
    cursor:pointer;
    transition:all .2s ease;
  }
  nav.tabs button.active, nav.tabs button:hover{
    background:var(--amber);
    color:var(--ink-dark);
    border-color:var(--amber);
  }

  /* ---------- GRID ---------- */
  main{
    max-width:1180px; margin:0 auto;
    padding:3rem 1.5rem 6rem;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:2.2rem 1.8rem;
  }

  /* ticket-stub product card, signature element */
  .card{
    background:var(--paper);
    color:var(--ink-dark);
    border-radius:14px;
    overflow:hidden;
    position:relative;
    box-shadow:0 12px 26px rgba(0,0,0,0.48);
    border:1px solid rgba(181,106,42,.22);
    display:flex; flex-direction:column;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 16px 34px rgba(0,0,0,.58);}
  .card{transition:transform .2s ease, box-shadow .2s ease;}
  .card .badge{
    position:absolute; top:0.8rem; left:0.8rem;
    background:var(--magenta); color:var(--paper);
    font-family:'JetBrains Mono',monospace;
    font-size:0.65rem; letter-spacing:0.06em;
    padding:0.25rem 0.55rem; border-radius:4px;
    text-transform:uppercase;
  }
  .card img{
       display:block; padding:0.75rem; background:#c8c2b5; cursor:pointer;
    filter:saturate(.82) contrast(1.04);
  
    width:100%; height:320px; aspect-ratio:auto; object-fit:cover; display:block;
}
  .stub-cut{
    height:22px; position:relative;
    background:
      radial-gradient(circle 11px at 0 50%, transparent 10px, var(--paper) 11px) left/22px 100% no-repeat,
      radial-gradient(circle 11px at 100% 50%, transparent 10px, var(--paper) 11px) right/22px 100% no-repeat,
      var(--bg);
  }
  .stub-cut::after{
    content:"";
    position:absolute; left:22px; right:22px; top:50%;
    border-top:2px dashed var(--bg-alt);
  }
  .card-body{
    padding:1.1rem 1.2rem 1.3rem;
    display:flex; flex-direction:column; gap:0.5rem; flex:1;
  }
  .card-body .series{
    font-family:'JetBrains Mono',monospace;
    font-size:0.68rem; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--amber);
  }
  .card-body h3{
    margin:0; font-family:'Anton',sans-serif; font-weight:400;
    font-size:1.3rem; letter-spacing:0.01em;
  }
  .card-body .desc{
    font-size:0.88rem; color:#4a4a5c; margin:0; flex:1;
  }
  .price-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:0.4rem;
    font-family:'JetBrains Mono',monospace;
  }
  .price-row .price{ font-size:1.15rem; font-weight:600; }
  .stock{ font-size:0.68rem; color:#6b6b7d; }

  form.pp{display:none;}
  .whatsapp-btn{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin-top:.6rem;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.05em;
    font-size:.82rem;
    text-transform:uppercase;
    text-align:center;
    text-decoration:none;
    background:#25D366;
    color:#07130b;
    border:none;
    border-radius:8px;
    padding:.75rem 1rem;
    cursor:pointer;
    transition:transform .12s ease, filter .2s ease;
  }
  .whatsapp-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .whatsapp-btn:active{transform:translateY(0);}
  .product-image-large{
    aspect-ratio:1 / 1.35 !important;
    object-fit:contain !important;
    background:#f2f2f0;
  }

  footer{
    text-align:center;
    padding:2.5rem 1.5rem 3rem;
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    color:rgba(243,238,226,0.5);
    border-top:1px dashed var(--line);
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 700px){
    body{overflow-x:hidden;}
    header.hero{padding:3rem 1rem 2.5rem;}
    .eyebrow{font-size:.58rem;letter-spacing:.18em;line-height:1.5;}
    h1{font-size:clamp(2.6rem,16vw,4.5rem);line-height:1;}
    header.hero p{font-size:.92rem;line-height:1.45;max-width:34rem;}
    nav.tabs{gap:.5rem;padding:1.25rem .8rem 0;}
    nav.tabs button{font-size:.68rem;padding:.55rem .85rem;}
    main{grid-template-columns:1fr;gap:1.25rem;padding:2rem .85rem 4rem;}
    .card{width:100%;border-radius:12px;}
    .card img{aspect-ratio:1/1; padding:.5rem;}
    .card-body{padding:1rem;}
    .card-body h3{font-size:1.25rem;}
    .card-body .desc{font-size:.84rem;}
    .price-row{gap:.75rem;flex-wrap:wrap;}
    .pp button{font-size:.76rem;padding:.8rem .7rem;}
    footer{padding:2rem 1rem 2.5rem;font-size:.65rem;}

    .gallery-modal{padding:10px;}
    .gallery-box{width:100%;height:92vh;}
    .gallery-main{max-width:calc(100vw - 30px);max-height:78vh;}
    .gallery-btn{width:42px;height:42px;font-size:25px;}
    .gallery-close{right:2px;top:2px;}
    .gallery-prev{left:2px;}
    .gallery-next{right:2px;}
    .gallery-count{bottom:0;font-size:.8rem;}
  }

  @media (max-width: 380px){
    header.hero{padding-left:.75rem;padding-right:.75rem;}
    nav.tabs button{font-size:.62rem;padding:.5rem .7rem;}
    main{padding-left:.65rem;padding-right:.65rem;}
    .gallery-main{max-height:74vh;}
  }

  .gallery-modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:25px}
  .gallery-modal.open{display:flex}
  .gallery-box{position:relative;width:min(1000px,95vw);height:min(92vh,950px);display:flex;align-items:center;justify-content:center}
  .gallery-main{max-width:100%;max-height:88vh;object-fit:contain;display:block}
  .gallery-btn{position:absolute;border:0;cursor:pointer;color:white;background:rgba(0,0,0,.7);font-size:32px;width:50px;height:50px;border-radius:50%;z-index:2}
  .gallery-close{right:0;top:0}.gallery-prev{left:0;top:50%;transform:translateY(-50%)}.gallery-next{right:0;top:50%;transform:translateY(-50%)}
  .gallery-count{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);color:white;background:rgba(0,0,0,.7);padding:5px 10px;border-radius:5px}

.gallery-modal img{
  max-width:90vw;
  max-height:85vh;
  width:auto;
  height:auto;
  object-fit:contain;
}
</style>
<style id="daryl-dixon-redesign">
@import url("https://db.onlinewebfonts.com/c/a91fa004cd0cfd612ca1dacaf9f8cbf0?family=Dead+Kansas");
:root{
  --bg:#171817;--bg2:#222322;--card:#292a28;--ink:#eee9df;--muted:#b8b2a8;
  --steel:#8f9a98;--rust:#6f4e3c;--line:rgba(235,228,214,.18);
}
body{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(121,109,91,.20),transparent 48%),
    linear-gradient(rgba(24,25,23,.78),rgba(16,17,16,.94)),
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 5px),
    var(--bg);
  color:var(--ink);
}
header.hero{
  position:relative;overflow:hidden;
  padding:6rem 1.5rem 5rem;
  background:
    linear-gradient(90deg,rgba(16,17,16,.55),rgba(45,42,37,.20),rgba(16,17,16,.62)),
    radial-gradient(ellipse at 50% 35%,rgba(154,136,107,.18),transparent 58%),
    #272825;
  border-bottom:1px solid var(--line);
  box-shadow:0 12px 45px rgba(0,0,0,.35);
}
header.hero:after{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(105deg,transparent 0 48%,rgba(0,0,0,.16) 49%,transparent 50%),
    repeating-linear-gradient(115deg,transparent 0 55px,rgba(255,255,255,.018) 56px,transparent 58px);
}
.eyebrow{position:relative;z-index:1;color:#c2b7a4;letter-spacing:.28em;}
h1{
  position:relative;z-index:1;
  font-family:"Dead Kansas",Impact,sans-serif;
  font-weight:400;
  font-size:clamp(4rem,11vw,8rem);
  letter-spacing:.045em;
  color:#eee9df;
  text-shadow:3px 4px 0 rgba(54,48,40,.75),0 8px 28px rgba(0,0,0,.42);
}
header.hero p{position:relative;z-index:1;color:#d1ccc2;max-width:720px;}
nav.tabs{position:relative;z-index:2;padding-top:2.2rem;}
nav.tabs button{
  border-radius:2px;border:1px solid rgba(231,224,209,.22);
  background:rgba(31,32,30,.84);color:#d8d1c5;
}
nav.tabs button.active,nav.tabs button:hover{
  background:#8b8374;color:#171817;border-color:#b3a894;
}
main{gap:2rem;padding-top:3rem;}
.card{
  background:linear-gradient(145deg,rgba(255,255,255,.055),transparent 45%),#292a28;
  color:var(--ink);border:1px solid var(--line);border-radius:3px;
  box-shadow:0 16px 34px rgba(0,0,0,.32);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card:hover{transform:translateY(-5px) rotate(-.2deg);border-color:rgba(211,197,174,.38);box-shadow:0 22px 42px rgba(0,0,0,.43);}
.card img{background:#1d1e1c;padding:.75rem;filter:sepia(.10) saturate(.78) contrast(1.05);}
.card .badge{background:#3b3b37;color:#ddd5c8;border:1px solid rgba(220,210,194,.18);border-radius:2px;}
.card-body{padding:1.2rem 1.25rem 1.35rem;}
.card-body .series{color:#aaa295;}
.card-body h3{color:#f0ebe2;}
.card-body .desc{color:#bdb7ad;}
.price-row .price{color:#e7dfd2;}
.stock{color:#a9a398;}
.whatsapp-btn{background:#35413d;color:#eee9df;border:1px solid #64736d;border-radius:3px;}
.whatsapp-btn:hover{background:#4c5d56;filter:none;}
footer{color:rgba(231,225,214,.48);border-top:1px solid var(--line);background:#151614;}
.gallery-modal{background:rgba(14,15,14,.95);}
.gallery-btn{background:rgba(39,40,38,.92);border:1px solid rgba(230,220,202,.2);}
@media(max-width:700px){header.hero{padding:4.5rem 1rem 3.5rem;}h1{font-size:4rem;}}
</style>
</head>

/* ====== 3) RENDU ====== */
const grid = document.getElementById("grid");

function render(filter){
  grid.innerHTML = "";
  const list = products.filter(p => filter === "tous" || p.cat === filter);
  if(list.length === 0){
    grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; font-family:'JetBrains Mono',monospace; color:rgba(243,238,226,0.55);">Aucun article pour l'instant — ajoute-les dans le tableau "products" du script.</p>`;
    return;
  }
  list
    .forEach(p => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <span class="badge">${p.badge}</span>
        <img src="${p.img}" alt="${p.title}" loading="lazy" class="product-image ${p.id === "vh-02" ? "product-image-large" : ""}" data-gallery-main="${p.img}" data-gallery-second="${p.secondImg || ""}">
        <div class="stub-cut"></div>
        <div class="card-body">
          <span class="series">${p.series}</span>
          <h3>${p.title}</h3>
          <p class="desc">${p.desc}</p>
          <div class="price-row">
            <span class="price">${p.price.toFixed(2)} €</span>
            <span class="stock">Réf. ${p.id}</span>
          </div>
          <a class="whatsapp-btn" href="https://wa.me/33603316180?text=${encodeURIComponent("Bonjour, je suis intéressé par la " + p.title + " (" + p.price.toFixed(2) + " €).")}" target="_blank" rel="noopener">
            Contacter via WhatsApp
          </a>
        </div>
      `;
      grid.appendChild(card);
    });
}
render("tous");

document.getElementById("tabs").addEventListener("click", e => {
  if(e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  render(e.target.dataset.filter);
});
</script>
<div class="gallery-modal" id="galleryModal">
<div class="gallery-box">
<button class="gallery-btn gallery-close" id="galleryClose">×</button>
<button class="gallery-btn gallery-prev" id="galleryPrev">‹</button>
<img class="gallery-main" id="galleryMain" src="" alt="">
<button class="gallery-btn gallery-next" id="galleryNext">›</button>
<div class="gallery-count" id="galleryCount"></div>
</div></div>
<script>
(function(){
 const modal=document.getElementById('galleryModal'), main=document.getElementById('galleryMain'),
 count=document.getElementById('galleryCount'), close=document.getElementById('galleryClose'),
 prev=document.getElementById('galleryPrev'), next=document.getElementById('galleryNext');
 let photos=[],n=0;
 function show(i){n=(i+photos.length)%photos.length;main.src=photos[n];count.textContent=(n+1)+' / '+photos.length;}
 document.addEventListener('click',function(e){
   const img=e.target.closest('.product-image'); if(!img)return;
   e.preventDefault(); e.stopPropagation();
   photos=[img.dataset.galleryMain]; if(img.dataset.gallerySecond)photos.push(img.dataset.gallerySecond);
   show(0); modal.classList.add('open'); document.body.style.overflow='hidden';
 });
 function hide(){modal.classList.remove('open');main.src='';document.body.style.overflow='';}
 close.onclick=hide; prev.onclick=()=>show(n-1); next.onclick=()=>show(n+1);
 modal.onclick=e=>{if(e.target===modal)hide();};
 document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')hide();if(e.key==='ArrowLeft')show(n-1);if(e.key==='ArrowRight')show(n+1);});
})();
</script>
