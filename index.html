<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TWD SHOP — Vêtements & objets de série</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#171817;--card:#292a28;--ink:#eee9df;--muted:#b8b2a8;--line:rgba(235,228,214,.18);--accent:#8b8374;--wa:#25D366}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% 0%,rgba(121,109,91,.2),transparent 48%),linear-gradient(rgba(24,25,23,.78),rgba(16,17,16,.94)),repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 5px),var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif}.scanlines{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
header.hero{padding:5rem 1.5rem 4rem;text-align:center;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(16,17,16,.55),rgba(45,42,37,.2),rgba(16,17,16,.62)),radial-gradient(ellipse at 50% 35%,rgba(154,136,107,.18),transparent 58%),#272825;border-bottom:1px solid var(--line);box-shadow:0 12px 45px rgba(0,0,0,.35)}.eyebrow{font: .7rem 'JetBrains Mono';letter-spacing:.28em;color:#c2b7a4;text-transform:uppercase}.hero h1{font:400 clamp(3.5rem,10vw,7rem) Impact,'Anton',sans-serif;letter-spacing:.045em;margin:.4rem 0 .6rem;color:#eee9df;text-shadow:3px 4px 0 rgba(54,48,40,.75),0 8px 28px rgba(0,0,0,.42)}header.hero p{max-width:720px;margin:auto;color:#d1ccc2}.topbar{max-width:1180px;margin:auto;padding:1.4rem 1.5rem 0;display:flex;justify-content:space-between;align-items:center;gap:1rem}.tabs{display:flex;gap:.6rem;flex-wrap:wrap}.tabs button,.cart-link{font: .78rem 'JetBrains Mono';text-transform:uppercase;letter-spacing:.06em;background:rgba(31,32,30,.84);border:1px solid var(--line);color:#d8d1c5;padding:.65rem 1rem;border-radius:2px;cursor:pointer;text-decoration:none}.tabs button.active,.tabs button:hover,.cart-link:hover{background:var(--accent);color:#171817}.cart-link span{background:var(--wa);color:#07130b;border-radius:50%;padding:.1rem .35rem;margin-left:.25rem}main{max-width:1180px;margin:auto;padding:2.8rem 1.5rem 6rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2rem}.card{background:linear-gradient(145deg,rgba(255,255,255,.055),transparent 45%),var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:0 16px 34px rgba(0,0,0,.32);overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-5px);box-shadow:0 22px 42px rgba(0,0,0,.43)}.card .badge{display:inline-block;margin:.8rem;background:#3b3b37;color:#ddd5c8;border:1px solid rgba(220,210,194,.18);padding:.25rem .55rem;font:600 .65rem 'JetBrains Mono';text-transform:uppercase}.card img{display:block;width:100%;height:330px;object-fit:contain;background:#1d1e1c;padding:.75rem}.card-body{padding:1.2rem 1.25rem 1.35rem}.series{color:#aaa295;font:.68rem 'JetBrains Mono';text-transform:uppercase;letter-spacing:.08em}.card h3{font:400 1.4rem Impact,'Anton',sans-serif;margin:.4rem 0}.desc{color:#bdb7ad;font-size:.88rem;min-height:3.8em}.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:.8rem;font-family:'JetBrains Mono'}.price{font-size:1.15rem;font-weight:600}.stock{font-size:.68rem;color:#a9a398}.open-btn{display:block;text-align:center;margin-top:.9rem;padding:.75rem;background:#35413d;color:#eee9df;border:1px solid #64736d;text-decoration:none;font:600 .78rem 'JetBrains Mono';text-transform:uppercase}footer{text-align:center;padding:2.5rem 1.5rem 3rem;font:.72rem 'JetBrains Mono';color:rgba(231,225,214,.48);border-top:1px solid var(--line);background:#151614}@media(max-width:700px){header.hero{padding:3.5rem 1rem 2.8rem}.eyebrow{font-size:.56rem;letter-spacing:.16em}.hero h1{font-size:clamp(3rem,16vw,4.5rem)}.topbar{padding:1rem .8rem 0;align-items:stretch;flex-direction:column}.tabs{justify-content:center}.cart-link{text-align:center}main{grid-template-columns:1fr;padding:2rem .85rem 4rem}.card img{height:300px}.card-body{padding:1rem}.desc{font-size:.84rem}}
</style></head><body><div class="scanlines"></div><header class="hero"><div class="eyebrow">THE WALKING DEAD · DARYL DIXON · ÉDITION LIMITÉE</div><h1>TWD SHOP</h1><p>Vêtements et objets inspirés de <strong>The Walking Dead</strong>. Commandes et contact via WhatsApp.</p></header><div class="topbar"><nav class="tabs" id="tabs"><button class="active" data-filter="tous">Tout</button><button data-filter="vetements">Vêtements</button><button data-filter="objets">Objets</button></nav><a class="cart-link" href="cart.html">🛒 Panier <span id="cartCount">0</span></a></div><main id="grid"></main><footer>© 2026 TWD SHOP · Contact et commandes via WhatsApp</footer><script>
const products=[{id:'vh-01',cat:'vetements',badge:'Collector',series:'The Walking Dead',title:'Veste Daryl Dixon',desc:'Gilet 100% cuir véritable, finition brute et robuste. Broderie ailes surpiquées sur le dos, laçage latéral ajustable, poches avant.',price:150,img:'https://m.media-amazon.com/images/I/81RGNjug1KL._AC_SX569_.jpg',sizes:['S','M','L','XL','2XL','3XL','4XL']},{id:'vh-02',cat:'vetements',badge:'Nouveau',series:'The Walking Dead',title:'Veste Daryl Dixon ailes bleu',desc:'Gilet 100% cuir véritable avec une aile en bleu comme dans la série.',price:165,img:'https://m.media-amazon.com/images/I/81RGNjug1KL._AC_SX569_.jpg',sizes:['S','M','L','XL','2XL','3XL','4XL']},{id:'obj-01',cat:'objets',badge:'Nouveau',series:'The Walking Dead',title:'Batte Negan Lucille',desc:'Réplique décorative inspirée de Lucille, destinée à la décoration et à l’exposition.',price:150,img:'https://i.ebayimg.com/images/g/19IAAOSwbm1ibR0k/s-l1200.jpg',sizes:['Unique']}];
function render(filter='tous'){grid.innerHTML='';products.filter(p=>filter==='tous'||p.cat===filter).forEach(p=>{const c=document.createElement('article');c.className='card';c.onclick=()=>location.href='product.html?id='+encodeURIComponent(p.id);c.innerHTML=`<span class="badge">${p.badge}</span><img src="${p.img}" alt="${p.title}"><div class="card-body"><span class="series">${p.series}</span><h3>${p.title}</h3><p class="desc">${p.desc}</p><div class="price-row"><span class="price">${p.price.toFixed(2)} €</span><span class="stock">Réf. ${p.id}</span></div><a class="open-btn" href="product.html?id=${encodeURIComponent(p.id)}">Voir le produit</a></div>`;grid.appendChild(c)}) ;updateCount()}function updateCount(){const c=JSON.parse(localStorage.getItem('twdCart')||'[]');cartCount.textContent=c.reduce((s,i)=>s+i.qty,0)}tabs.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.filter)});render();
</script></body></html>
