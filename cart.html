<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TWD SHOP — Panier</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#171817;--card:#292a28;--ink:#eee9df;--muted:#b8b2a8;--line:rgba(235,228,214,.18);--wa:#25D366}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,rgba(121,109,91,.2),transparent 48%),linear-gradient(rgba(24,25,23,.78),rgba(16,17,16,.94)),var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif}.wrap{max-width:1050px;margin:auto;padding:2rem 1.2rem 6rem}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}.top a{color:var(--ink);text-decoration:none;font:.8rem 'JetBrains Mono'}.top h1{font:400 3rem Impact,'Anton',sans-serif;margin:0}.item{display:grid;grid-template-columns:110px 1fr auto;gap:1.2rem;align-items:center;border:1px solid var(--line);background:var(--card);padding:1rem;margin-bottom:.8rem}.item img{width:110px;height:110px;object-fit:contain;background:#1d1e1c}.name{font-size:1.1rem}.meta{color:var(--muted);font:.75rem 'JetBrains Mono';margin-top:.4rem}.controls{display:flex;align-items:center;gap:.5rem}.controls button{background:transparent;border:1px solid #77736b;color:var(--ink);width:32px;height:32px;cursor:pointer}.remove{color:#d0b8ae;border:0!important;background:none!important;cursor:pointer}.summary{margin-top:2rem;border-top:1px solid var(--line);padding-top:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}.total{font:1.3rem 'JetBrains Mono'}.wa{background:var(--wa);color:#07130b;border:1px solid var(--wa);padding:1rem 1.4rem;font:600 .75rem 'JetBrains Mono';text-transform:uppercase;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:4rem 1rem}@media(max-width:650px){.item{grid-template-columns:75px 1fr}.item img{width:75px;height:75px}.controls{grid-column:2}.summary{flex-direction:column;align-items:stretch}.top h1{font-size:2.2rem}}</style></head><body><main class="wrap"><div class="top"><a href="index.html">← TWD SHOP</a><h1>PANIER</h1><span></span></div><div id="list"></div><div id="summary"></div></main><script>function get(){return JSON.parse(localStorage.getItem('twdCart')||'[]')}function save(c){localStorage.setItem('twdCart',JSON.stringify(c));render()}function render(){const c=get();if(!c.length){list.innerHTML='<div class="empty">Ton panier est vide.<br><br><a href="index.html" style="color:#eee9df">Retourner aux produits</a></div>';summary.innerHTML='';return}list.innerHTML=c.map((i,n)=>`<div class="item"><img src="${i.img}" alt=""><div><div class="name">${i.title}</div><div class="meta">Taille : ${i.size} · ${i.price.toFixed(2)} €</div></div><div><div class="controls"><button onclick="change(${n},-1)">−</button><b>${i.qty}</b><button onclick="change(${n},1)">+</button><button class="remove" onclick="removeItem(${n})">Supprimer</button></div></div></div>`).join('');const total=c.reduce((s,i)=>s+i.price*i.qty,0);summary.innerHTML=`<div class="summary"><div class="total">Total : ${total.toFixed(2)} €</div><button class="wa" onclick="whatsapp()">Commander le panier via WhatsApp</button></div>`}function change(n,d){let c=get();c[n].qty=Math.max(1,c[n].qty+d);save(c)}function removeItem(n){let c=get();c.splice(n,1);save(c)}function whatsapp(){const c=get();let text='Bonjour, je souhaite commander :\n\n'+c.map(i=>`- ${i.title} | Taille : ${i.size} | Quantité : ${i.qty} | ${i.price.toFixed(2)} €`).join('\n');const total=c.reduce((s,i)=>s+i.price*i.qty,0);text+=`\n\nTotal : ${total.toFixed(2)} €`;window.open('https://wa.me/33603316180?text='+encodeURIComponent(text),'_blank')}render();</script></body></html>
