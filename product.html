<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TWD SHOP — Produit</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#171817;--card:#292a28;--ink:#eee9df;--muted:#b8b2a8;--line:rgba(235,228,214,.18);--accent:#8b8374;--wa:#25D366}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,rgba(121,109,91,.2),transparent 48%),linear-gradient(rgba(24,25,23,.78),rgba(16,17,16,.94)),var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;max-width:1250px;margin:auto;padding:0 1.5rem}.nav a{color:var(--ink);text-decoration:none;font:.8rem 'JetBrains Mono'}.cart{border:1px solid var(--line);padding:.65rem 1rem}.cart span{background:var(--wa);color:#07130b;border-radius:50%;padding:.1rem .35rem}.product{max-width:1250px;margin:2rem auto 6rem;padding:0 1.5rem;display:grid;grid-template-columns:1.05fr .95fr;gap:4rem;align-items:start}.visual{background:#1d1e1c;min-height:650px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}.visual img{width:100%;height:650px;object-fit:contain;padding:1rem}.crumb{font:.7rem 'JetBrains Mono';color:#aaa295;text-transform:uppercase}.badge{display:inline-block;background:#35413d;border:1px solid #64736d;padding:.35rem .65rem;font:600 .7rem 'JetBrains Mono';margin:1rem 0}.info h1{font:400 clamp(2.2rem,5vw,4rem) Impact,'Anton',sans-serif;margin:.2rem 0 .5rem}.price{font:1.5rem 'JetBrains Mono';margin-bottom:2rem}.label{font-size:.8rem;margin:1.3rem 0 .5rem;color:#b8b2a8}.sizes{display:flex;gap:.55rem;flex-wrap:wrap}.size{background:transparent;color:var(--ink);border:1px solid #77736b;padding:.8rem 1rem;min-width:55px;cursor:pointer}.size.active{background:#eee9df;color:#171817}.qty{display:flex;align-items:center;width:max-content;border:1px solid #77736b}.qty button,.qty input{height:44px;background:transparent;color:var(--ink);border:0;text-align:center}.qty button{width:42px;font-size:1.2rem;cursor:pointer}.qty input{width:45px;font-family:'JetBrains Mono';font-size:1rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:2rem}.btn{padding:1rem;border:1px solid #64736d;background:#35413d;color:var(--ink);font:600 .75rem 'JetBrains Mono';cursor:pointer;text-transform:uppercase}.btn.wa{background:var(--wa);border-color:var(--wa);color:#07130b}.message{margin-top:1rem;min-height:22px;color:#b8b2a8;font-size:.85rem}.back{display:inline-block;margin:0 0 1rem;color:#b8b2a8;text-decoration:none;font:.75rem 'JetBrains Mono'}@media(max-width:800px){.product{grid-template-columns:1fr;gap:2rem;padding:0 .85rem;margin-top:1rem}.visual,.visual img{min-height:380px;height:55vh;max-height:600px}.actions{grid-template-columns:1fr}.nav{padding:0 .85rem}}</style></head><body><nav class="nav"><a href="index.html">← TWD SHOP</a><a class="cart" href="cart.html">🛒 Panier <span id="cartCount">0</span></a></nav><main class="product"><section class="visual"><img id="image" src="" alt=""></section><section class="info"><a class="back" href="index.html">← Retour aux produits</a><div class="badge" id="badge"></div><div class="crumb" id="series"></div><h1 id="title"></h1><div class="price" id="price"></div><p id="desc" style="color:#b8b2a8"></p><div class="label" id="sizeLabel">TAILLE</div><div class="sizes" id="sizes"></div><div class="label">QUANTITÉ</div><div class="qty"><button id="minus">−</button><input id="qty" value="1" min="1" type="number"><button id="plus">+</button></div><div class="actions"><button class="btn wa" id="whatsapp">Commander via WhatsApp</button><button class="btn" id="add">Ajouter au panier</button></div><div class="message" id="message"></div></section></main><script>
const products={'vh-01':{badge:'Collector',series:'The Walking Dead',title:'Veste Daryl Dixon',desc:'Gilet 100% cuir véritable, finition brute et robuste. Broderie ailes surpiquées sur le dos, laçage latéral ajustable, poches avant.',price:150,img:'https://m.media-amazon.com/images/I/81RGNjug1KL._AC_SX569_.jpg',sizes:['S','M','L','XL','2XL','3XL','4XL']},'vh-02':{badge:'Nouveau',series:'The Walking Dead',title:'Veste Daryl Dixon ailes bleu',desc:'Gilet 100% cuir véritable avec une aile en bleu comme dans la série.',price:165,img:'https://m.media-amazon.com/images/I/81RGNjug1KL._AC_SX569_.jpg',sizes:['S','M','L','XL','2XL','3XL','4XL']},'obj-01':{badge:'Nouveau',series:'The Walking Dead',title:'Batte Negan Lucille',desc:'Réplique décorative inspirée de Lucille, destinée à la décoration et à l’exposition.',price:150,img:'https://i.ebayimg.com/images/g/19IAAOSwbm1ibR0k/s-l1200.jpg',sizes:['Unique']}};
const id=new URLSearchParams(location.search).get('id');const p=products[id]||products['vh-01'];let selected=p.sizes[0];image.src=p.img;image.alt=p.title;badge.textContent=p.badge;series.textContent=p.series;title.textContent=p.title;price.textContent=p.price.toFixed(2)+' €';desc.textContent=p.desc;sizeLabel.style.display=p.sizes.length===1?'none':'';sizes.innerHTML=p.sizes.map((s,i)=>`<button class="size ${i===0?'active':''}" data-size="${s}">${s}</button>`).join('');document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=b.dataset.size});minus.onclick=()=>qty.value=Math.max(1,(+qty.value||1)-1);plus.onclick=()=>qty.value=(+qty.value||1)+1;function cart(){return JSON.parse(localStorage.getItem('twdCart')||'[]')}function save(c){localStorage.setItem('twdCart',JSON.stringify(c));updateCount()}function updateCount(){cartCount.textContent=cart().reduce((s,i)=>s+i.qty,0)}add.onclick=()=>{let c=cart(),found=c.find(i=>i.id===id&&i.size===selected);if(found)found.qty+=+qty.value;else c.push({id,title:p.title,price:p.price,size:selected,qty:+qty.value,img:p.img});save(c);message.textContent='✓ Article ajouté au panier.'};whatsapp.onclick=()=>{const q=Math.max(1,+qty.value||1);const text=`Bonjour, je suis intéressé par la ${p.title} (${p.price.toFixed(2)} €). Taille : ${selected}. Quantité : ${q}.`;window.open('https://wa.me/33603316180?text='+encodeURIComponent(text),'_blank')};updateCount();</script></body></html>
